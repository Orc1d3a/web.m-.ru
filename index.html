<!DOCTYPE html>
<!--
  ===== НАСТРОЙКИ: меняйте только то, что внутри кавычек =====

  QR_IMAGE_URL — ссылка на готовую картинку QR-кода
  BUTTON_URL   — ссылка, на которую ведёт правая кнопка (с иконкой вопроса)
  BUTTON_TIP   — текст подсказки при наведении на эту кнопку
  OWN_TEXT     — белый текст под QR-кодом, который вы придумываете сами

  Сами настройки находятся чуть ниже, в теге <script id="settings">
-->
<html lang="ru">
<head>
<script id="settings">
  const QR_IMAGE_URL = "";
  const BUTTON_URL = "https://help.max.ru/help";
  const BUTTON_TIP = "Ответы на популярные вопросы";
  const OWN_TEXT = "Войдите в MAX по QR-коду";
</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MAX</title>
<link rel="icon" href="favicon.png" type="image/png">
<style>
  :root {
    --panel: #17181b;
    --panel-border: #2a2c31;
    --menu: #1c1d21;
    --text: #ffffff;
    --hover: rgba(255, 255, 255, 0.09);
    --tip: #4a4c52;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; margin: 0; }

  body {
    background: #111113 url("bg.png") center / cover no-repeat fixed;
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .panel {
    width: min(420px, 100%);
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 28px;
    padding: 14px 18px 28px;
  }

  .bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .slot { position: relative; }

  .icon-btn {
    width: 48px;
    height: 48px;
    border: 0;
    border-radius: 50%;
    background: transparent;
    color: var(--text);
    display: grid;
    place-items: center;
    cursor: pointer;
    transition: background-color .15s ease;
    text-decoration: none;
  }
  .icon-btn:hover,
  .icon-btn[aria-expanded="true"] { background: var(--hover); }
  .icon-btn:focus-visible { outline: 2px solid #8b93ff; outline-offset: 2px; }
  .icon-btn svg { width: 24px; height: 24px; }

  /* Меню языков */
  .menu {
    position: absolute;
    top: 56px;
    left: 0;
    min-width: 230px;
    margin: 0;
    padding: 8px;
    list-style: none;
    background: var(--menu);
    border: 1px solid var(--panel-border);
    border-radius: 16px;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
    opacity: 0;
    visibility: hidden;
    transform: translateY(-4px);
    transition: opacity .15s ease, transform .15s ease, visibility .15s;
    z-index: 5;
  }
  .menu.open { opacity: 1; visibility: visible; transform: none; }

  .menu button {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 10px 12px;
    border: 0;
    border-radius: 10px;
    background: transparent;
    color: var(--text);
    font: inherit;
    font-size: 15px;
    text-align: left;
    cursor: pointer;
  }
  .menu button:hover { background: var(--hover); }
  .menu button:focus-visible { outline: 2px solid #8b93ff; }
  .menu svg { width: 18px; height: 18px; }

  /* Подсказка у кнопки со ссылкой */
  .tip {
    position: absolute;
    top: 56px;
    right: 0;
    white-space: nowrap;
    background: var(--tip);
    color: var(--text);
    font-size: 14px;
    padding: 10px 14px;
    border-radius: 12px;
    opacity: 0;
    visibility: hidden;
    transition: opacity .15s ease;
    pointer-events: none;
    z-index: 4;
  }
  .slot:hover .tip,
  .slot:focus-within .tip { opacity: 1; visibility: visible; }

  /* QR */
  .qr-wrap {
    margin: 18px auto 0;
    width: 232px;
    height: 232px;
    padding: 16px;
    background: transparent;
    border-radius: 20px;
    display: grid;
    place-items: center;
  }
  .qr-wrap img { display: block; max-width: 100%; max-height: 100%; }
  .qr-error { color: #fff; font-size: 13px; text-align: center; padding: 0 12px; }

  /* Текст под QR, который вы вводите сами (белым) */
  .own-text {
    margin: 20px auto 0;
    max-width: 320px;
    color: #ffffff;
    font-size: 15px;
    font-weight: 600;
    text-align: center;
  }

  /* Серая подпись под QR */
  .caption {
    margin: 10px auto 0;
    max-width: 280px;
    color: #9a9ca3;
    font-size: 14px;
    line-height: 1.4;
    text-align: center;
  }

  /* Синяя ссылка внизу, с той же рамкой-подсветкой при наведении, что у кнопок */
  .phone-link {
    display: block;
    width: fit-content;
    margin: 18px auto 0;
    padding: 8px 14px;
    border-radius: 999px;
    color: #4e9bff;
    font-size: 14px;
    text-decoration: none;
    transition: background-color .15s ease;
  }
  .phone-link:hover,
  .phone-link:focus-visible { background: var(--hover); }
  .phone-link:focus-visible { outline: 2px solid #8b93ff; outline-offset: 2px; }

  @media (hover: none) {
    .tip { display: none; }
  }
</style>
</head>
<body>

<main class="panel">
  <div class="bar">

    <!-- Левая кнопка: открывает панель с языками -->
    <div class="slot">
      <button class="icon-btn" id="lang-btn" type="button"
              aria-label="Язык" aria-haspopup="true" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="10"/>
          <path d="M2 12h20"/>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
        </svg>
      </button>

      <ul class="menu" id="lang-menu" role="menu">
        <li role="none"><button role="menuitem" type="button">Русский
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
        </button></li>
        <li role="none"><button role="menuitem" type="button">English</button></li>
        <li role="none"><button role="menuitem" type="button">Español</button></li>
        <li role="none"><button role="menuitem" type="button">Português (Brasil)</button></li>
        <li role="none"><button role="menuitem" type="button">Oʻzbekcha</button></li>
        <li role="none"><button role="menuitem" type="button">Français</button></li>
        <li role="none"><button role="menuitem" type="button">Беларуская</button></li>
      </ul>
    </div>

    <!-- Правая кнопка: ведёт на сайт -->
    <div class="slot">
      <a class="icon-btn" id="link-btn" href="#" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="10"/>
          <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
          <path d="M12 17h.01"/>
        </svg>
      </a>
      <span class="tip" id="link-tip"></span>
    </div>

  </div>

  <div class="qr-wrap" id="qr" role="img" aria-label="QR-код"></div>

  <!-- Этот текст вы пишете сами, прямо здесь -->
  <p class="own-text" id="own-text">Ваш текст здесь</p>

  <p class="caption">Наведите камеру на QR-код, чтобы войти<br>в профиль или скачать приложение</p>

  <a class="phone-link" href="#">Войти по номеру телефона</a>
</main>

<script>
  // QR — просто показываем картинку по ссылке
  const qrBox = document.getElementById("qr");
  const qrImg = new Image();
  qrImg.alt = "QR-код";
  qrImg.onload = () => { qrBox.appendChild(qrImg); };
  qrImg.onerror = () => {
    qrBox.innerHTML = '<span class="qr-error">Не удалось загрузить QR-код <br> Перезагрузите страницу</span>';
  };
  qrImg.src = QR_IMAGE_URL;

  // Текст под QR
  document.getElementById("own-text").textContent = OWN_TEXT;

  // Правая кнопка
  const linkBtn = document.getElementById("link-btn");
  linkBtn.href = BUTTON_URL;
  linkBtn.setAttribute("aria-label", BUTTON_TIP);
  document.getElementById("link-tip").textContent = BUTTON_TIP;

  // Меню языков
  const langBtn = document.getElementById("lang-btn");
  const langMenu = document.getElementById("lang-menu");

  function setMenu(open) {
    langMenu.classList.toggle("open", open);
    langBtn.setAttribute("aria-expanded", String(open));
  }

  langBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    setMenu(!langMenu.classList.contains("open"));
  });

  // Языки пока не переключаются: клик по пункту просто закрывает меню
  langMenu.addEventListener("click", () => setMenu(false));

  document.addEventListener("click", () => setMenu(false));
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { setMenu(false); langBtn.focus(); }
  });
</script>
</body>
</html>
